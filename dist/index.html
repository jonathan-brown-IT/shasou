<style>
:root{
  --ink:#12151c;
  --ink-2:#1b2029;
  --panel:#14161b;
  --card:#1b1f27;
  --line-green:#8fd400;
  --line-green-dim:#5d8a0f;
  --amber:#e8b769;
  --paper:#eee7d8;
  --dim:#8891a0;
  --led-off:#2a2515;
  --led-on:#ffd24d;
  --danger:#e0654f;
  font-family:'Zen Kaku Gothic New','Hiragino Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;}
#densha-root{
  background:var(--ink);
  color:var(--paper);
  border-radius:14px;
  overflow:hidden;
  width:100%;
  max-width:820px;
  margin:0 auto;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* ===== TOP HALF — unchanged ===== */
.window-scene{position:relative;height:220px;overflow:hidden;background:linear-gradient(180deg,var(--sky-top,#1a2540),var(--sky-bot,#0c1220));transition:background 3s ease;}
.skyline{position:absolute;bottom:0;left:0;width:200%;height:70%;display:flex;align-items:flex-end;animation:scroll 14s linear infinite;}
.skyline.back{opacity:.45;animation-duration:26s;}
.bldg{background:#0d1118;margin-right:6px;flex-shrink:0;position:relative;border-top:2px solid #05070a;}
.bldg i{position:absolute;width:4px;height:4px;background:var(--amber);opacity:.8;}
@keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.window-frame{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 10px #0a0d13, inset 0 0 40px rgba(0,0,0,.6);border-radius:14px 14px 0 0;}
.mullion{position:absolute;top:10px;bottom:0;width:8px;background:#0a0d13;}
.mullion.m1{left:33%;} .mullion.m2{left:66%;}
.led-strip{background:#08090b;padding:10px 14px;display:flex;align-items:center;gap:10px;border-top:3px solid var(--line-green-dim);border-bottom:1px solid #000;overflow:hidden;}
.led-tag{background:var(--line-green);color:#0a0d05;font-weight:800;font-size:12px;padding:3px 7px;border-radius:3px;letter-spacing:.5px;flex-shrink:0;}
.led-track{display:flex;gap:22px;font-family:'Courier New',monospace;letter-spacing:1px;transition:transform .6s ease;white-space:nowrap;}
.led-stop{color:var(--led-off);font-size:15px;font-weight:700;transition:color .4s;}
.led-stop.current{color:var(--led-on);text-shadow:0 0 8px rgba(255,210,77,.6);}
.led-stop .rt{font-size:10px;display:block;color:inherit;opacity:.8;font-family:sans-serif;}
.info-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:12px;color:var(--dim);background:var(--ink-2);}
.info-bar b{color:var(--paper);}
.weather-out{display:flex;align-items:center;gap:5px;}
.w-icon{display:inline-flex;width:14px;height:14px;color:var(--amber);}
.w-icon svg{width:100%;height:100%;}
.subtitle-zone{min-height:120px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;position:relative;background:radial-gradient(ellipse at top,rgba(143,212,0,.05),transparent 70%);}
.jp-line{font-size:26px;font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease;}
.jp-line.show{opacity:1;transform:translateY(0);}
.romaji-line{font-size:13px;color:var(--amber);opacity:0;transition:opacity .5s ease .1s;}
.romaji-line.show{opacity:1;}
.en-line{font-size:13px;color:var(--dim);opacity:0;transition:opacity .5s ease .15s;}
.en-line.show{opacity:1;}
.tag-pill{position:absolute;top:10px;left:14px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--line-green);border:1px solid var(--line-green-dim);padding:2px 8px;border-radius:10px;opacity:.85;}
.star-btn{position:absolute;top:8px;right:40px;background:none;border:none;font-size:20px;cursor:pointer;color:#3a3f4b;transition:color .2s,transform .2s;}
.star-btn.active{color:var(--led-on);transform:scale(1.15);}
.speak-btn{position:absolute;top:9px;right:12px;background:none;border:none;font-size:17px;cursor:pointer;color:#5d6472;transition:color .2s,transform .15s;}
.speak-btn:hover{color:var(--line-green);}
.speak-btn.playing{color:var(--line-green);transform:scale(1.2);}
.empty-note{color:var(--dim);font-size:13px;font-style:italic;}

/* ===== BOTTOM HALF — control-deck redesign ===== */
.controls{
  position:relative;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 1px, transparent 1px, transparent 3px),
    linear-gradient(160deg,#181c23,#101317);
  padding:18px 18px 20px;
  display:flex;flex-direction:column;gap:14px;
  border-top:1px solid #262b33;
}
.rivet{position:absolute;width:5px;height:5px;border-radius:50%;background:#05070a;box-shadow:inset 0 1px 1px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.05);}
.rivet.tl{top:8px;left:8px;} .rivet.tr{top:8px;right:8px;}

.deck-plaque{display:flex;align-items:center;gap:6px;font-size:9.5px;text-transform:uppercase;letter-spacing:1.6px;color:var(--dim);}
.deck-plaque .dot{width:6px;height:6px;border-radius:50%;background:var(--line-green);box-shadow:0 0 6px var(--line-green);}

.music-panel{
  background:linear-gradient(135deg,#1a2010,#151920);
  border:1px solid #2a3320;
  border-radius:12px;
  padding:14px 16px;
  display:flex;align-items:center;gap:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.music-play{
  width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #a6f000, #6f9e00);
  color:#0a0d05;border:none;font-size:15px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px rgba(143,212,0,.12), 0 4px 10px rgba(0,0,0,.4);
  transition:transform .15s;
}
.music-play:active{transform:scale(.9);}
.music-meta{flex:1;min-width:0;}
.music-title{font-size:12.5px;font-weight:700;color:var(--paper);display:flex;align-items:center;gap:8px;}
.music-sub{font-size:10.5px;color:var(--dim);margin-top:2px;letter-spacing:.2px;}
.eq{display:flex;align-items:flex-end;gap:2px;height:13px;}
.eq i{width:3px;background:var(--line-green);border-radius:1px;opacity:.35;animation:eqbar 1.1s ease-in-out infinite;}
.eq.on i{opacity:1;}
.eq i:nth-child(1){animation-delay:0s;} .eq i:nth-child(2){animation-delay:.2s;}
.eq i:nth-child(3){animation-delay:.4s;} .eq i:nth-child(4){animation-delay:.15s;}
@keyframes eqbar{0%,100%{height:3px;}50%{height:13px;}}
.vol-wrap{display:flex;align-items:center;gap:6px;color:var(--dim);flex-shrink:0;}

/* custom slider look, used for music vol + speed */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;
  background:linear-gradient(90deg, var(--line-green) 0%, var(--line-green) var(--fill,35%), #2a303b var(--fill,35%));
  outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:#f4f1e6;box-shadow:0 0 0 3px rgba(143,212,0,.35),0 1px 3px rgba(0,0,0,.5);cursor:grab;}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;border:none;
  background:#f4f1e6;box-shadow:0 0 0 3px rgba(143,212,0,.35);cursor:grab;}
.music-vol{width:84px;}

.deck-row{display:grid;grid-template-columns:1.1fr 1.1fr 1fr;gap:10px;}
.setting-card{background:var(--card);border-radius:12px;padding:11px 13px;border:1px solid #262c37;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);}
.setting-card label{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.setting-card label svg{width:12px;height:12px;flex-shrink:0;opacity:.8;}
.seg{display:flex;background:#0c0e12;border-radius:8px;padding:3px;gap:3px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5);}
.seg button{flex:1;background:none;border:none;color:var(--dim);padding:6px 4px;font-size:11.5px;border-radius:6px;cursor:pointer;transition:.15s;}
.seg button.on{background:var(--line-green);color:#0a0d05;font-weight:700;}
.speed-readout{font-family:'Courier New',monospace;font-size:17px;font-weight:800;color:var(--line-green);text-align:center;margin-top:6px;letter-spacing:1px;}

.switch-deck{display:flex;flex-direction:column;gap:9px;background:var(--card);border:1px solid #262c37;border-radius:12px;padding:11px 13px;}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.switch-row .lbl{font-size:12.5px;color:var(--paper);display:flex;align-items:center;gap:8px;}
.switch-row .lbl svg{width:14px;height:14px;opacity:.85;color:var(--dim);}
.switch{width:38px;height:21px;border-radius:11px;background:#2a303b;border:none;position:relative;cursor:pointer;flex-shrink:0;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.6);transition:background .2s;}
.switch .knob{position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#7c8494;transition:transform .2s, background .2s;box-shadow:0 1px 2px rgba(0,0,0,.4);}
.switch.on{background:var(--line-green-dim);}
.switch.on .knob{transform:translateX(17px);background:#eaffb0;}

.list-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid #262c37;border-radius:12px;padding:11px 13px;cursor:pointer;color:var(--paper);font-size:12.5px;}
.list-btn .lbl{display:flex;align-items:center;gap:8px;}
.list-btn svg{width:14px;height:14px;color:var(--led-on);}
.list-btn .count{background:#0c0e12;border-radius:10px;padding:2px 9px;font-size:11px;color:var(--line-green);font-weight:700;}
.list-btn .chev{color:var(--dim);transition:transform .2s;}
.list-btn.open .chev{transform:rotate(180deg);}

.mylist-wrap{max-height:0;overflow:hidden;transition:max-height .25s ease;border-radius:12px;}
.mylist-wrap.open{max-height:220px;}
.mylist{max-height:220px;overflow-y:auto;padding:10px 13px;font-size:12px;background:var(--card);border:1px solid #262c37;border-top:none;border-radius:0 0 12px 12px;}
.mylist-item{display:flex;justify-content:space-between;gap:8px;padding:5px 2px;border-bottom:1px solid #232833;}
.mylist-item span:first-child{color:var(--paper);}
.mylist-item span:last-child{color:var(--dim);text-align:right;}
.export-btn{font-size:11px;background:none;border:1px solid var(--line-green-dim);color:var(--line-green);padding:5px 11px;border-radius:6px;cursor:pointer;margin-top:8px;}
</style>

<div id="densha-root">
  <div class="window-scene" id="scene">
    <div class="skyline back" id="skylineBack"></div>
    <div class="skyline" id="skylineFront"></div>
    <div class="window-frame"><div class="mullion m1"></div><div class="mullion m2"></div></div>
  </div>

  <div class="led-strip">
    <span class="led-tag">JY</span>
    <div class="led-track" id="ledTrack"></div>
  </div>

  <div class="info-bar">
    <span>山手線 &middot; Yamanote Loop</span>
    <span class="weather-out" id="weatherOut"><span id="weatherIcon" class="w-icon"></span><span id="weatherTemp">--&deg;</span> <span id="dateOut">--/--</span></span>
    <span id="clockOut"><b>--:--</b> JST</span>
  </div>

  <div class="subtitle-zone" id="subZone">
    <span class="tag-pill" id="subTag">phrase</span>
    <button class="star-btn" id="starBtn" title="Save to my list">&#9733;</button>
    <button class="speak-btn" id="speakBtn" title="Hear it">&#128266;</button>
    <div class="jp-line" id="jpLine"></div>
    <div class="romaji-line" id="romajiLine"></div>
    <div class="en-line" id="enLine"></div>
    <div class="empty-note" id="emptyNote" style="display:none;">Ambient mode &mdash; no text, just the ride.</div>
  </div>

  <div class="controls">
    <div class="rivet tl"></div><div class="rivet tr"></div>
    <div class="deck-plaque"><span class="dot"></span> Ride control deck</div>

    <div class="music-panel">
      <button class="music-play" id="musicToggle">&#9654;</button>
      <div class="music-meta">
        <div class="music-title">Lofi ambience <span class="eq" id="musicBars"><i></i><i></i><i></i><i></i></span></div>
        <div class="music-sub">Generated loop &middot; soft keys, slow beat</div>
      </div>
      <div class="vol-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        <input type="range" class="music-vol" id="musicVol" min="0" max="1" step="0.01" value="0.35" style="--fill:35%">
      </div>
    </div>

    <div class="deck-row">
      <div class="setting-card">
        <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 5V4L8 9H4z"/></svg>Frequency</label>
        <div class="seg" id="freqSeg">
          <button data-v="off">Off</button>
          <button data-v="rare">Rare</button>
          <button data-v="frequent" class="on">Freq</button>
        </div>
      </div>
      <div class="setting-card">
        <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Content</label>
        <div class="seg" id="contentSeg">
          <button data-v="phrases" class="on">Phrase</button>
          <button data-v="songs">Song</button>
          <button data-v="both">Both</button>
        </div>
      </div>
      <div class="setting-card">
        <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>Speed</label>
        <input type="range" id="speedSlider" min="1" max="40" value="10" style="--fill:23%">
        <div class="speed-readout" id="speedReadout">10x</div>
      </div>
    </div>

    <div class="switch-deck">
      <div class="switch-row">
        <span class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.09 9a3 3 0 1 1 5.83 1c0 2-3 3-3 3M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>Quiz check-ins</span>
        <button class="switch" id="quizChip"><span class="knob"></span></button>
      </div>
      <div class="switch-row">
        <span class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Auto-play audio</span>
        <button class="switch on" id="autoAudioChip"><span class="knob"></span></button>
      </div>
    </div>

    <button class="list-btn" id="listChip">
      <span class="lbl"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 15 9l7 1-5 5 1.5 7L12 18l-6.5 4L7 15 2 10l7-1z"/></svg>My saved list</span>
      <span style="display:flex;align-items:center;gap:8px;">
        <span class="count" id="listCount">0</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="m6 9 6 6 6-6"/></svg>
      </span>
    </button>
    <div class="mylist-wrap" id="mylistWrap">
      <div class="mylist" id="mylist"></div>
    </div>

    <div style="text-align:center;font-size:9.5px;color:var(--dim);letter-spacing:.3px;padding-top:2px;">
      Voice: VOICEVOX:四国めたん (Shikoku Metan) &middot; <a href="https://voicevox.hiroshiba.jp/" target="_blank" rel="noopener" style="color:var(--dim);">voicevox.hiroshiba.jp</a>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.58/Tone.js"></script>
<script>
(function(){
  const stations = [
    ["Tokyo","Tōkyō"],["Kanda","Kanda"],["Akihabara","Akihabara"],["Okachimachi","Okachimachi"],
    ["Ueno","Ueno"],["Uguisudani","Uguisudani"],["Nippori","Nippori"],["Nishi-Nippori","Nishi-Nippori"],
    ["Tabata","Tabata"],["Komagome","Komagome"],["Sugamo","Sugamo"],["Otsuka","Ōtsuka"],
    ["Ikebukuro","Ikebukuro"],["Mejiro","Mejiro"],["Takadanobaba","Takadanobaba"],["Shin-Okubo","Shin-Ōkubo"],
    ["Shinjuku","Shinjuku"],["Yoyogi","Yoyogi"],["Harajuku","Harajuku"],["Shibuya","Shibuya"],
    ["Ebisu","Ebisu"],["Meguro","Meguro"],["Gotanda","Gotanda"],["Osaki","Ōsaki"],
    ["Shinagawa","Shinagawa"],["Takanawa Gateway","Takanawa Gateway"],["Tamachi","Tamachi"],
    ["Hamamatsucho","Hamamatsuchō"],["Shimbashi","Shimbashi"],["Yurakucho","Yūrakuchō"]

  const segTimes = stations.map(()=> 90 + Math.floor(Math.random()*70));

  const phrases = [
    {jp:"これは山手線です。",ro:"Kore wa Yamanote-sen desu.",en:"This is the Yamanote Line.",lvl:"N5"},
    {jp:"次は渋谷駅です。",ro:"Tsugi wa Shibuya-eki desu.",en:"Next is Shibuya Station.",lvl:"N5"},
    {jp:"今、何時ですか。",ro:"Ima, nanji desu ka?",en:"What time is it now?",lvl:"N5"},
    {jp:"電車はとても速いです。",ro:"Densha wa totemo hayai desu.",en:"The train is very fast.",lvl:"N5"},
    {jp:"外は雨が降っています。",ro:"Soto wa ame ga futte imasu.",en:"It's raining outside.",lvl:"N5"},
    {jp:"私は毎日、電車で学校へ行きます。",ro:"Watashi wa mainichi, densha de gakkou e ikimasu.",en:"I go to school by train every day.",lvl:"N5"},
    {jp:"この席は空いていますか。",ro:"Kono seki wa aite imasu ka?",en:"Is this seat free?",lvl:"N5"},
    {jp:"すみません、切符を落としました。",ro:"Sumimasen, kippu wo otoshimashita.",en:"Excuse me, I dropped my ticket.",lvl:"N5"},
    {jp:"新宿で乗り換えます。",ro:"Shinjuku de norikaemasu.",en:"I'll transfer at Shinjuku.",lvl:"N5"},

    {jp:"駅の前にコンビニがあります。",ro:"Eki no mae ni konbini ga arimasu.",en:"There's a convenience store in front of the station.",lvl:"N5"},
    {jp:"夜の街はにぎやかです。",ro:"Yoru no machi wa nigiyaka desu.",en:"The city at night is lively.",lvl:"N5"},
    {jp:"もうすぐ終電です。",ro:"Mou sugu shuuden desu.",en:"The last train is coming soon.",lvl:"N5"},

    {jp:"曇っていて、少し寒いです。",ro:"Kumotte ite, sukoshi samui desu.",en:"It's cloudy and a bit cold.",lvl:"N5"},
    {jp:"電車の中で音楽を聞きます。",ro:"Densha no naka de ongaku wo kikimasu.",en:"I listen to music inside the train.",lvl:"N5"},

  function playAudio(text, btn){
    const b64 = AUDIO_DATA[text];
    if(b64){
      const a = new Audio("data:audio/ogg;base64,"+b64);
      if(btn){ btn.classList.add('playing'); a.onended=()=>btn.classList.remove('playing'); }
      a.play().catch(()=>{});
    } else if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance(text);
      u.lang='ja-JP'; speechSynthesis.cancel(); speechSynthesis.speak(u);
    }
  }

  const el = id => document.getElementById(id);
  let state = {
    speedMult: 10, freq: "frequent", content: "phrases", quiz: false, autoAudio: true,
    musicVol: 0.35, idx: 0, segElapsed: 0, starred: []
  };

  const STORAGE_KEY = "densha:state:v3";
  async function loadState(){
    try{
      const r = await window.storage.get(STORAGE_KEY, false);
      if(r && r.value) Object.assign(state, JSON.parse(r.value));
    }catch(e){}
    applyControlsFromState();
    renderMyList();
  }
  async function saveState(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify({
        speedMult:state.speedMult, freq:state.freq, content:state.content,
        quiz:state.quiz, autoAudio:state.autoAudio, musicVol:state.musicVol, starred:state.starred
      }), false);
    }catch(e){ console.warn("save failed", e); }
  }

  function setRangeFill(input){
    const pct = ((input.value - input.min) / (input.max - input.min)) * 100;
    input.style.setProperty('--fill', pct + '%');
  }

  function applyControlsFromState(){
    document.querySelectorAll('#freqSeg button').forEach(b=>b.classList.toggle('on', b.dataset.v===state.freq));
    document.querySelectorAll('#contentSeg button').forEach(b=>b.classList.toggle('on', b.dataset.v===state.content));
    el('speedSlider').value = state.speedMult;
    el('speedReadout').textContent = state.speedMult + "x";
    setRangeFill(el('speedSlider'));
    el('quizChip').classList.toggle('on', state.quiz);
    el('autoAudioChip').classList.toggle('on', state.autoAudio);
    el('musicVol').value = state.musicVol;
    setRangeFill(el('musicVol'));
    el('listCount').textContent = state.starred.length;
  }

  function buildSkyline(id, count, tall){
    const wrap = el(id);
    wrap.innerHTML = "";
    for(let i=0;i<count;i++){
      const h = tall ? 60+Math.random()*90 : 30+Math.random()*50;
      const w = 18+Math.random()*26;
      const b = document.createElement('div');
      b.className='bldg'; b.style.height=h+'px'; b.style.width=w+'px';
      const lights = Math.floor(h/14);
      for(let L=0;L<lights;L++){
        if(Math.random()>0.55){
          const dot=document.createElement('i');
          dot.style.left=(4+Math.random()*(w-8))+'px';
          dot.style.bottom=(6+L*13)+'px';
          b.appendChild(dot);
        }
      }
      wrap.appendChild(b);
    }
  }
  buildSkyline('skylineFront', 40, true);
  buildSkyline('skylineBack', 30, false);

  function updateSky(){
    const jst = new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Tokyo"}));
    const h = jst.getHours();
    const scene = el('scene');
    let top,bot;
    if(h>=5&&h<8){top='#3a3550';bot='#c98a5e';}
    else if(h>=8&&h<17){top='#4a83c9';bot='#8fbede';}
    else if(h>=17&&h<19){top='#3a2b55';bot='#d9704f';}
    else {top='#0d1424';bot='#050810';}
    scene.style.setProperty('--sky-top',top);
    scene.style.setProperty('--sky-bot',bot);
    el('clockOut').innerHTML = `<b>${jst.toTimeString().slice(0,5)}</b> JST`;
    el('dateOut').textContent = `${jst.getMonth()+1}/${jst.getDate()}`;
  }
  updateSky();
  setInterval(updateSky, 30000);

  function weatherCategory(code){
    if(code === 0) return 'clear';
    if(code === 1) return 'partly';
    if(code === 2 || code === 3) return 'cloudy';
    if(code === 45 || code === 48) return 'fog';
    if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return 'rain';
    if([71,73,75,77,85,86].includes(code)) return 'snow';
    if([95,96,99].includes(code)) return 'storm';
    return 'cloudy';
  }
  async function fetchWeather(){
    try{
      const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&current=temperature_2m,weather_code&timezone=Asia%2FTokyo");
      const data = await res.json();
      const temp = Math.round(data.current.temperature_2m);
      const cat = weatherCategory(data.current.weather_code);
      el('weatherTemp').textContent = temp + "\u00b0C";
      el('weatherIcon').innerHTML = WEATHER_ICONS[cat] || WEATHER_ICONS.cloudy;
    }catch(e){
      el('weatherTemp').textContent = "--\u00b0";
    }
  }
  fetchWeather();
  setInterval(fetchWeather, 15 * 60 * 1000);

  function renderLed(){
    const track = el('ledTrack');

    for(let i=0;i<6;i++){
      const s = stations[(state.idx+i)%stations.length];
      const d = document.createElement('div');
      d.className = 'led-stop'+(i===0?' current':'');
      d.innerHTML = s[0] + '<span class="rt">'+s[1]+'</span>';
      track.appendChild(d);
    }
  }
  renderLed();

  let pool = [];
  function rebuildPool(){
    pool = state.content==="phrases" ? phrases.slice()
         : state.content==="songs" ? songs.slice()
         : phrases.concat(songs);
  }
  rebuildPool();

  function wireSpeak(text){
    const btn = el('speakBtn');
    btn.style.display='block';
    btn.onclick = ()=>playAudio(text, btn);
    if(state.autoAudio) setTimeout(()=>playAudio(text, btn), 200);
  }

  function showLine(item, tagLabel){
    const jp=el('jpLine'), ro=el('romajiLine'), en=el('enLine'), tag=el('subTag'), star=el('starBtn'), empty=el('emptyNote');
    [jp,ro,en].forEach(x=>x.classList.remove('show'));
    empty.style.display='none';
    jp.style.display='block'; ro.style.display='block'; en.style.display='block'; star.style.display='block'; tag.style.display='inline-block';
    tag.textContent = tagLabel;
    setTimeout(()=>{
      jp.textContent = item.jp; ro.textContent = item.ro; en.textContent = item.en;
      jp.classList.add('show'); ro.classList.add('show'); en.classList.add('show');
      star.classList.toggle('active', state.starred.some(s=>s.jp===item.jp));
      star.onclick = ()=>{
        const exists = state.starred.findIndex(s=>s.jp===item.jp);
        if(exists>=0){ state.starred.splice(exists,1); star.classList.remove('active'); }
        else { state.starred.push(item); star.classList.add('active'); }
        el('listCount').textContent = state.starred.length;
        renderMyList(); saveState();
      };
      wireSpeak(item.jp);
    }, 120);
  }

  function showQuiz(){
    const v = vocab[Math.floor(Math.random()*vocab.length)];
    const jp=el('jpLine'), ro=el('romajiLine'), en=el('enLine'), tag=el('subTag'), star=el('starBtn'), empty=el('emptyNote');
    [jp,ro,en].forEach(x=>x.classList.remove('show'));
    empty.style.display='none'; star.style.display='none';
    tag.style.display='inline-block'; tag.textContent='quiz';
    const opts = [v.en, ...v.dist].sort(()=>Math.random()-0.5);
    jp.style.display='block'; jp.textContent = v.jp + "  (" + v.ro + ")";
    ro.style.display='none';
    en.style.display='flex'; en.style.flexDirection='column'; en.style.gap='4px'; en.style.color='var(--paper)';
    en.innerHTML = opts.map(o=>`<button class="chip" style="width:100%;justify-content:center;border-radius:8px;padding:8px;background:#1b1f27;border:1px solid #262c37;color:var(--paper);cursor:pointer;" data-correct="${o===v.en}">${o}</button>`).join("");
    setTimeout(()=>{
      jp.classList.add('show'); en.classList.add('show');
      en.querySelectorAll('button').forEach(b=>{
        b.onclick = ()=>{
          const ok = b.dataset.correct === "true";
          b.style.borderColor = ok ? 'var(--line-green)' : 'var(--danger)';
          b.style.color = ok ? 'var(--line-green)' : 'var(--danger)';
          if(!ok){
            en.querySelectorAll('button').forEach(x=>{ if(x.dataset.correct==="true"){ x.style.borderColor='var(--line-green)'; x.style.color='var(--line-green)'; } });
          }
        };
      });
      wireSpeak(v.jp);
    },120);
  }

  function showEmpty(){
    ['jpLine','romajiLine','enLine'].forEach(id=>{ el(id).classList.remove('show'); el(id).style.display='none'; });
    el('starBtn').style.display='none'; el('subTag').style.display='none'; el('speakBtn').style.display='none';
    el('emptyNote').style.display='block';
  }

  function renderMyList(){
    const box = el('mylist');
    if(state.starred.length===0){ box.innerHTML = '<div class="empty-note" style="display:block;">Nothing saved yet — tap the star on a phrase to keep it.</div>'; return; }
    box.innerHTML = state.starred.map(s=>`<div class="mylist-item"><span>${s.jp}</span><span>${s.en}</span></div>`).join("")
      + '<button class="export-btn" id="exportBtn">Copy as Anki-ready text (tab-separated)</button>';
    el('exportBtn').onclick = ()=>{
      const text = state.starred.map(s=>`${s.jp}\t${s.ro}\t${s.en}`).join("\n");
      navigator.clipboard.writeText(text).then(()=>{
        el('exportBtn').textContent = "Copied ✓";
        setTimeout(()=>el('exportBtn').textContent="Copy as Anki-ready text (tab-separated)", 1500);
      });
    };
  }

  let tickCount = 0;
  setInterval(()=>{
    tickCount++;
    state.segElapsed += state.speedMult;
    const segLen = segTimes[state.idx];
    if(state.segElapsed >= segLen){
      state.segElapsed = 0;
      state.idx = (state.idx+1) % stations.length;
      renderLed();
    }
    if(state.freq === "off") { showEmpty(); return; }
    const interval = state.freq === "frequent" ? 7 : 16;
    if(tickCount % interval === 0){
      if(state.quiz && Math.random() < 0.3){
        showQuiz();
      } else {
        if(pool.length===0) rebuildPool();
        const item = pool[Math.floor(Math.random()*pool.length)];
        const tag = songs.includes(item) ? "song" : "phrase";
        showLine(item, tag);
      }
    }
  }, 1000);

  let musicStarted = false, musicPlaying = false;
  let epiano, bassSynth, kotoSynth, kick, snare, hat, masterVol;

  async function initMusic(){
    if(musicStarted) return;
    musicStarted = true;
    await Tone.start();

    masterVol = new Tone.Volume(Tone.gainToDb(state.musicVol)).toDestination();
    const airFilter = new Tone.Filter(3000, "lowpass").connect(masterVol);
    // much lighter reverb than before — a small room, not a cathedral
    const reverb = new Tone.Reverb({decay:1.8, wet:0.18}).connect(airFilter);

    // warm electric-piano-style stab (gentle FM, fast decay — no droning)
    epiano = new Tone.PolySynth(Tone.FMSynth, {
      harmonicity:2, modulationIndex:2.2,
      envelope:{attack:0.008, decay:1.1, sustain:0.15, release:1.0},
      modulation:{type:"sine"},
      modulationEnvelope:{attack:0.01, decay:0.3, sustain:0, release:0.5}
    }).connect(reverb);
    epiano.volume.value = -14;

    // soft round bass, syncopated — not sustained drone
    bassSynth = new Tone.MonoSynth({
      oscillator:{type:"sine"},
      envelope:{attack:0.02, decay:0.3, sustain:0.25, release:0.6}
    }).connect(airFilter);
    bassSynth.volume.value = -14;

    // koto/music-box accent — sparse pentatonic garnish, kept quiet
    kotoSynth = new Tone.PluckSynth({attackNoise:0.5, dampening:4500, resonance:0.8}).connect(reverb);
    kotoSynth.volume.value = -20;

    // boom-bap drums — this is what makes it read as "lofi" instead of "ambient score"
    kick = new Tone.MembraneSynth({
      pitchDecay:0.05, octaves:6, envelope:{attack:0.001, decay:0.35, sustain:0}
    }).connect(masterVol);
    kick.volume.value = -8;

    snare = new Tone.NoiseSynth({
      noise:{type:"pink"}, envelope:{attack:0.001, decay:0.18, sustain:0}
    }).connect(new Tone.Filter(1800,"bandpass").connect(masterVol));
    snare.volume.value = -18;

    hat = new Tone.NoiseSynth({
      noise:{type:"white"}, envelope:{attack:0.001, decay:0.03, sustain:0}
    }).connect(new Tone.Filter(7000,"highpass").connect(masterVol));
    hat.volume.value = -30;

    // soft vinyl air, very quiet — texture only
    const vinyl = new Tone.Noise("pink").start();
    const vinylFilter = new Tone.Filter(2200, "lowpass");
    const vinylGain = new Tone.Gain(0.012).connect(masterVol);
    vinyl.connect(vinylFilter); vinylFilter.connect(vinylGain);

    Tone.Transport.bpm.value = 78;
    Tone.Transport.swing = 0.55;
    Tone.Transport.swingSubdivision = "8n";

    // warm major7/6 progression, resolves cleanly — no unresolved tension
    const chords = [
      ["C4","E4","G4","B4"],   // Cmaj7
      ["A3","C4","E4","G4"],   // Am7
      ["F3","A3","C4","E4"],   // Fmaj7
      ["G3","B3","D4","E4"]    // G6
    ];
    const roots = ["C2","A2","F2","G2"];
    const pentatonic = ["C5","D5","E5","G5","A5"];

    let bar = 0;
    // one bar = one loop tick; drums + chords locked to a real groove
    new Tone.Loop(time=>{
      const chordIdx = Math.floor(bar/2) % chords.length;
      // chord stab on beat 1 of every 2nd bar (half-note harmonic rhythm)
      if(bar % 2 === 0) epiano.triggerAttackRelease(chords[chordIdx], "2n", time);
      // syncopated bass: root on 1, ghost on the "and" of 3
      bassSynth.triggerAttackRelease(roots[chordIdx], "4n", time);
      bassSynth.triggerAttackRelease(roots[chordIdx], "8n", time + Tone.Time("4n")*2.5);
      // boom-bap: kick on 1 & the "and" of 2, snare on 3
      kick.triggerAttackRelease("C1", "8n", time);
      kick.triggerAttackRelease("C1", "8n", time + Tone.Time("4n")*1.5);
      snare.triggerAttackRelease("8n", time + Tone.Time("4n")*2);
      // soft swung hats, sparse
      for(let s=0;s<4;s++){
        if(Math.random()>0.35) hat.triggerAttackRelease("16n", time + Tone.Time("4n")*s*0.5);
      }
      // occasional pentatonic garnish, once every few bars
      if(Math.random()>0.7){
        const note = pentatonic[Math.floor(Math.random()*pentatonic.length)];
        kotoSynth.triggerAttack(note, time + Tone.Time("4n")*3);
      }
      bar++;
    }, "1m").start(0);
  }

  el('musicToggle').addEventListener('click', async ()=>{
    await initMusic();
    const bars = el('musicBars');
    if(!musicPlaying){
      Tone.Transport.start();
      musicPlaying = true;
      el('musicToggle').innerHTML = "&#10074;&#10074;";
      bars.classList.add('on');
    } else {
      Tone.Transport.pause();
      musicPlaying = false;
      el('musicToggle').innerHTML = "&#9654;";
      bars.classList.remove('on');
    }
  });
  el('musicVol').addEventListener('input', e=>{
    state.musicVol = parseFloat(e.target.value);
    setRangeFill(e.target);
    if(masterVol) masterVol.volume.value = Tone.gainToDb(state.musicVol);
    saveState();
  });

  el('freqSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.freq = b.dataset.v;
    document.querySelectorAll('#freqSeg button').forEach(x=>x.classList.toggle('on', x===b));
    saveState();
  });
  el('contentSeg').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.content = b.dataset.v;
    document.querySelectorAll('#contentSeg button').forEach(x=>x.classList.toggle('on', x===b));
    rebuildPool(); saveState();
  });
  el('speedSlider').addEventListener('input', e=>{
    state.speedMult = parseInt(e.target.value,10);
    el('speedReadout').textContent = state.speedMult + "x";
    setRangeFill(e.target);
    saveState();
  });
  el('quizChip').addEventListener('click', ()=>{
    state.quiz = !state.quiz;
    el('quizChip').classList.toggle('on', state.quiz);
    saveState();
  });
  el('autoAudioChip').addEventListener('click', ()=>{
    state.autoAudio = !state.autoAudio;
    el('autoAudioChip').classList.toggle('on', state.autoAudio);
    saveState();
  });
  el('listChip').addEventListener('click', ()=>{
    el('mylistWrap').classList.toggle('open');
    el('listChip').classList.toggle('open');
  });

  loadState();
})();
</script>
